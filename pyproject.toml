[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "async-processing"
version = "0.1.0"
description = "Asynchronous transaction processing service."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aio-pika>=9.5,<10",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "prometheus-client>=0.21,<1",
    "pydantic-settings>=2.6,<3",
    "psycopg[binary]>=3.2,<4",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.coverage.run]
branch = true
source = ["src"]
