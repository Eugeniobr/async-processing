name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: quality (unit and contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Run unit and contract tests
        run: python -m pytest -q tests/unit tests/contract

  integration:
    name: integration (PostgreSQL, RabbitMQ, and Jaeger)
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}
      DATABASE_URL: postgresql+psycopg://async_processing:async_processing@localhost:5433/async_processing
      RABBITMQ_URL: amqp://async_processing:async_processing@localhost:5672/
      RABBITMQ_MANAGEMENT_URL: http://localhost:15672
      RABBITMQ_USERNAME: async_processing
      RABBITMQ_PASSWORD: async_processing
      RABBITMQ_VHOST_ENCODED: "%2F"
      JAEGER_QUERY_URL: http://localhost:16686
      JAEGER_OTLP_URL: http://localhost:4318/v1/traces
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Start isolated real test infrastructure
        run: docker compose up --detach --wait --wait-timeout 90 postgres rabbitmq jaeger
      - name: Verify service endpoints and credentials
        run: |
          python - <<'PY'
          import os

          from sqlalchemy import create_engine, text
          import httpx

          engine = create_engine(os.environ["DATABASE_URL"], pool_pre_ping=True)
          with engine.connect() as connection:
              assert connection.execute(text("SELECT 1")).scalar_one() == 1
          engine.dispose()

          response = httpx.get(
              f"{os.environ['RABBITMQ_MANAGEMENT_URL']}/api/overview",
              auth=(os.environ["RABBITMQ_USERNAME"], os.environ["RABBITMQ_PASSWORD"]),
              timeout=10,
          )
          response.raise_for_status()
          assert response.json()["rabbitmq_version"].startswith("4.3.")

          jaeger = httpx.get(f"{os.environ['JAEGER_QUERY_URL']}/", timeout=10)
          jaeger.raise_for_status()
          PY
      - name: Run real-infrastructure integration and recovery tests
        # The public Frankfurter check remains opt-in (RUN_EXTERNAL_PROVIDER_TESTS=1).
        # Local tracing is included through test_live_tracing.py and Jaeger above.
        run: |
          python -m pytest -q \
            tests/integration/test_concurrent_deduplication.py \
            tests/integration/test_live_tracing.py \
            tests/integration/test_metrics_and_failures.py \
            tests/integration/test_postgres_repository.py \
            tests/integration/test_rabbitmq_consumer.py \
            tests/integration/test_rabbitmq_topology.py \
            tests/integration/test_retry_and_failure_routing.py \
            tests/integration/test_scalable_consumers.py \
            tests/integration/test_transaction_acceptance.py \
            tests/integration/test_user_queries.py \
            tests/recovery
      - name: Collect infrastructure diagnostics
        if: failure()
        run: |
          mkdir -p ci-diagnostics
          docker compose ps > ci-diagnostics/compose-ps.txt
          docker compose logs --no-color > ci-diagnostics/compose.log
          docker compose config > ci-diagnostics/compose-config.yaml
      - name: Upload infrastructure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-diagnostics/
          if-no-files-found: error
      - name: Remove isolated test infrastructure
        if: always()
        run: docker compose down --volumes --remove-orphans
