apiVersion: batch/v1
kind: Job
metadata: {name: migrate}
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001}
      containers:
        - name: migrate
          image: async-processing:local
          imagePullPolicy: Never
          args: [composition.migrate_main]
          envFrom: [{secretRef: {name: runtime}}, {configMapRef: {name: application}}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 192Mi}
