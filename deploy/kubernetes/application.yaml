apiVersion: v1
kind: Service
metadata: {name: api}
spec:
  selector: {app: api}
  ports: [{name: http, port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      terminationGracePeriodSeconds: 45
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001}
      containers:
        - name: api
          image: async-processing:local
          imagePullPolicy: Never
          args: [composition.api_main]
          envFrom: [{secretRef: {name: runtime}}, {configMapRef: {name: application}}]
          env: [{name: DATABASE_POOL_SIZE, value: "2"}]
          ports: [{name: metrics, containerPort: 8000}]
          startupProbe: {httpGet: {path: /healthz, port: 8000}, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /healthz, port: 8000}}
          livenessProbe: {httpGet: {path: /healthz, port: 8000}, periodSeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 96Mi}
            limits: {cpu: "1", memory: 256Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: consumer}
spec:
  selector: {matchLabels: {app: consumer}}
  template:
    metadata: {labels: {app: consumer}}
    spec:
      terminationGracePeriodSeconds: 45
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001}
      containers:
        - name: consumer
          image: async-processing:local
          imagePullPolicy: Never
          args: [composition.consumer_main]
          envFrom: [{secretRef: {name: runtime}}, {configMapRef: {name: application}}]
          ports: [{name: metrics, containerPort: 8001}]
          startupProbe: {httpGet: {path: /readyz, port: 8001}, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /readyz, port: 8001}}
          livenessProbe: {httpGet: {path: /healthz, port: 8001}, periodSeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 96Mi}
            limits: {cpu: "1", memory: 256Mi}
